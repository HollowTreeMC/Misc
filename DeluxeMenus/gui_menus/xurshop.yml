menu_title: 'Xur'
inventory_type: "HOPPER"

open_requirement:
  requirements:
    permission:
      type: has permission
      deny_commands:
        - "[message] &cYou don't have permission to open this menu!"

items:
  # Xur Slot Shop 1, Rare Black Market Item
  "Slot1Item":
    slot: 0
    update: true
    hide_attributes: true
    #item config
    material: placeholder-%denizen_<server.flag[xur_shop_slot1].material.name>%
    display_name: "%denizen_<server.flag[xur_shop_slot1].display>%"
    lore:
      - "<server.flag[xur_shop_slot1].enchantment_map.to_list[ ].formatted>"
      - "<server.flag[xur_shop_slot1].lore>"
      - "&6150⚙ Sigils"
      - "&b75 Levels"
    # purchase item behavior
    left_click_requirement:
      deny_commands:
      - "[message] %denizen_<server.flag[pfx_xur]>% Scram!"
      - "[close]"
      requirements:
        stop_at_success: false
        perm1:
          type: '>'
          input: '%tne_currency_sigils%'
          output: '150'
        perm2:
          type: '>'
          input: '%player_level%'
          output: '75'
    left_click_commands:
      - "[console] ex give <server.flag[xur_shop_slot1]> player:<server.match_player[%player_name%]>"
      - "[console] money take %player_name% 150 sigils"
      - "[console] experience add %player_name% -75 levels"
      - "[message] %denizen_<server.flag[pfx_xur]>% Take it... may it serve you better than it did its last owner."
      - "[console] ex flag player:<server.match_player[%player_name%]> xur_obtained expire:3d"
      - "[close]"

